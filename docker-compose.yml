version: "3.9"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    OPENLINEAGE_URL: http://marquez:5000
    OPENLINEAGE_NAMESPACE: fitlake
    _PIP_ADDITIONAL_REQUIREMENTS: "openlineage-airflow apache-airflow-providers-apache-spark"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./spark/jobs:/opt/spark/jobs
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ────────────────────────────────────────────
  #  Object Storage (local S3 replacement)
  # ────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: fitlake-minio
    ports:
      - "9000:9000"
      - "9001:9001"   # MinIO Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: fitlake-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/fitlake;
        mc mb --ignore-existing local/fitlake-raw;
        mc anonymous set public local/fitlake;
        echo 'Buckets created.';
      "

  # ────────────────────────────────────────────
  #  Apache Spark (Master + 2 Workers)
  # ────────────────────────────────────────────
  spark-master:
    image: bitnami/spark:3.5
    container_name: fitlake-spark-master
    ports:
      - "8080:8080"   # Spark Master UI
      - "7077:7077"
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./spark/conf/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
      - ./data:/opt/spark/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      retries: 5

  spark-worker-1:
    image: bitnami/spark:3.5
    container_name: fitlake-spark-worker-1
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./spark/conf/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
      - ./data:/opt/spark/data

  spark-worker-2:
    image: bitnami/spark:3.5
    container_name: fitlake-spark-worker-2
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./spark/conf/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
      - ./data:/opt/spark/data

  # ────────────────────────────────────────────
  #  Data Lineage: Marquez
  # ────────────────────────────────────────────
  marquez:
    image: marquezproject/marquez:latest
    container_name: fitlake-marquez
    ports:
      - "5000:5000"   # Marquez API
      - "5001:5001"
    depends_on:
      marquez-db:
        condition: service_healthy
    environment:
      - MARQUEZ_CONFIG=/opt/marquez/marquez.yml
    volumes:
      - ./docs/marquez.yml:/opt/marquez/marquez.yml

  marquez-web:
    image: marquezproject/marquez-web:latest
    container_name: fitlake-marquez-web
    ports:
      - "3000:3000"   # Lineage UI
    environment:
      - MARQUEZ_HOST=marquez
      - MARQUEZ_PORT=5000
    depends_on:
      - marquez

  marquez-db:
    image: postgres:14
    container_name: fitlake-marquez-db
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    volumes:
      - marquez-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "marquez"]
      interval: 5s
      retries: 5

  # ────────────────────────────────────────────
  #  Airflow
  # ────────────────────────────────────────────
  postgres:
    image: postgres:14
    container_name: fitlake-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    container_name: fitlake-airflow-init
    command: >
      bash -c "
        airflow db init &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@fitlake.io
      "
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    container_name: fitlake-airflow-webserver
    ports:
      - "8081:8080"   # Airflow UI
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: fitlake-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ────────────────────────────────────────────
  #  Analytics Dashboard
  # ────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: analytics/Dockerfile
    container_name: fitlake-dashboard
    ports:
      - "8501:8501"   # Streamlit UI
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./analytics:/app/analytics
      - ./sql:/app/sql

volumes:
  minio-data:
  postgres-data:
  marquez-db-data:
  airflow-logs:
